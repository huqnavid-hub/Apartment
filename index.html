<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huq Apartment Dhaka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16; --surface: #131c2e; --surface-card: #182238; --surface-hover: #22304e;
      --border: #263554; --border-subtle: #1e2b45;
      --text: #f8fafc; --text-muted: #94a3b8; --text-dim: #64748b;
      --accent: #10b981; --accent-glow: rgba(16, 185, 129, 0.15);
      --sidebar-width: 270px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 1.5rem 1rem; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 20;
    }
    .brand { font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 2rem; padding: 0.25rem 0.5rem; line-height: 1.2; }
    .brand span { color: var(--accent); display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
    .nav-section { margin-bottom: 1.5rem; }
    .nav-header { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); font-weight: 700; margin-bottom: 0.5rem; padding-left: 0.5rem; }
    .nav-btn {
      width: 100%; text-align: left; background: transparent; border: none; color: var(--text-muted);
      padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; margin-bottom: 0.35rem;
    }
    .nav-btn:hover { background: var(--surface-hover); color: var(--text); }
    .nav-btn.active { background: var(--accent-glow); color: var(--accent); border-left: 3px solid var(--accent); }
    .nav-count { font-size: 0.75rem; background: var(--border); padding: 2px 7px; border-radius: 99px; color: var(--text-muted); }
    .nav-btn.active .nav-count { background: var(--accent); color: #090d16; font-weight: 700; }

    .btn-add-vault {
      margin-top: auto; background: var(--accent); color: #090d16; border: none; font-weight: 700;
      padding: 0.85rem; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      font-size: 0.95rem; transition: transform 0.15s, opacity 0.15s;
    }
    .btn-add-vault:hover { opacity: 0.92; transform: translateY(-1px); }

    /* Main Content */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    
    /* Top Bar */
    .topbar {
      height: 72px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 2rem; gap: 1rem;
    }
    .menu-toggle { display: none; background: transparent; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }
    .search-container { flex: 1; max-width: 650px; position: relative; }
    .search-container input {
      width: 100%; padding: 0.8rem 1rem 0.8rem 2.75rem; border-radius: 99px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.95rem; outline: none; transition: all 0.2s;
    }
    .search-container input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-dim); }

    /* Workspace */
    .workspace { flex: 1; padding: 2rem; overflow-y: auto; }
    .page-header { margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem; }
    .page-title { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    .page-stats { font-size: 0.9rem; color: var(--text-muted); }

    /* Filter Chips */
    .chips-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 1.25rem; scrollbar-width: none; }
    .chips-bar::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
      padding: 0.4rem 0.85rem; border-radius: 99px; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s;
    }
    .chip:hover { border-color: var(--accent); color: var(--text); }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #090d16; }

    /* Grid & Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1.25rem; }
    .card {
      background: var(--surface-card); border: 1px solid var(--border); border-radius: 14px;
      padding: 1.35rem; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-2px); border-color: #3b4d75; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; margin-bottom: 0.6rem; }
    .card-title { font-weight: 700; font-size: 1.1rem; color: #fff; line-height: 1.3; }
    .card-subtitle { font-size: 0.9rem; color: #34d399; margin-top: 3px; font-weight: 500; }
    
    .badge {
      font-size: 0.72rem; font-weight: 700; padding: 0.3rem 0.6rem; border-radius: 6px;
      text-transform: uppercase; white-space: nowrap; background: var(--border); color: var(--text-muted); letter-spacing: 0.04em;
    }
    .badge.active { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge.highlight { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(16, 185, 129, 0.3); }
    
    .card-meta { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.85rem; line-height: 1.45; }
    .card-meta strong { color: #f1f5f9; }
    .card-notes {
      font-size: 0.85rem; color: #cbd5e1; border-top: 1px solid var(--border-subtle);
      padding-top: 0.85rem; margin-top: auto; line-height: 1.45;
    }
    .card-notes-bn { font-size: 0.82rem; color: #94a3b8; margin-top: 0.45rem; line-height: 1.4; }

    .empty-state { text-align: center; padding: 5rem 1rem; color: var(--text-muted); grid-column: 1 / -1; font-size: 1.05rem; }

    /* Modal Form */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 1.25rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 2rem; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 1.5rem; letter-spacing: -0.01em; }
    .form-group { margin-bottom: 1.1rem; }
    .form-row { display: flex; gap: 1rem; }
    .form-row .form-group { flex: 1; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.45rem; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.75rem 0.95rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.75rem; }
    .btn-secondary { background: var(--surface-hover); color: var(--text); border: none; padding: 0.75rem 1.35rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #090d16; font-weight: 700; border: none; padding: 0.75rem 1.6rem; border-radius: 8px; cursor: pointer; }

    @media (max-width: 768px) {
      .sidebar { position: absolute; left: -270px; height: 100%; box-shadow: 10px 0 30px rgba(0,0,0,0.7); }
      .sidebar.open { transform: translateX(270px); }
      .menu-toggle { display: block; }
      .topbar { padding: 0 1rem; }
      .workspace { padding: 1.25rem 1rem; }
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      Huq Apartment
      <span>Dhaka Inventory</span>
    </div>
    
    <div class="nav-section">
      <div class="nav-header">Inventory</div>
      <button class="nav-btn active" onclick="navigate('kitchen', event)">
        <span>🥫 Kitchen & Pantry</span>
        <span class="nav-count" id="count-kitchen">0</span>
      </button>
      <button class="nav-btn" onclick="navigate('alcohol', event)">
        <span>🥃 Master Alcohol</span>
        <span class="nav-count" id="count-alcohol">0</span>
      </button>
    </div>
    
    <div class="nav-section">
      <div class="nav-header">Culinary</div>
      <button class="nav-btn" onclick="navigate('recipes', event)">
        <span>📖 Master Recipes</span>
        <span class="nav-count" id="count-recipes">0</span>
      </button>
    </div>

    <button class="btn-add-vault" onclick="openAddModal()">＋ Add Entry</button>
  </nav>

  <!-- Main Content -->
  <div class="main-content">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="globalSearch" placeholder="Search across Huq Apartment inventory...">
      </div>
    </header>

    <main class="workspace">
      <div class="page-header">
        <div>
          <h1 class="page-title" id="pageTitle">Kitchen & Pantry</h1>
          <div class="page-stats" id="pageStats">Loading data...</div>
        </div>
      </div>

      <div class="chips-bar" id="categoryChips"></div>
      <div class="grid" id="mainGrid"></div>
    </main>
  </div>

  <!-- Add Entry Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <h2 class="modal-title" id="modalHeading">Add New Entry</h2>
      <form id="addEntryForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label>Target Database</label>
          <select id="entryType" onchange="switchFormFields()">
            <option value="kitchen">🥫 Kitchen & Pantry</option>
            <option value="alcohol">🥃 Master Alcohol</option>
            <option value="recipes">📖 Master Recipes</option>
          </select>
        </div>

        <div id="dynamicFields"></div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeAddModal()">Cancel</button>
          <button type="submit" class="btn-primary" id="btnSubmit">Save to Database</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const KITCHEN_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT836L087viXjJaJOhgbGFsRhPHcRZcR-hKAE0gd7TZPWX9De7MxGrCnvMweyH2SzI69QgUamzouqUY/pub?output=csv";
    const ALCOHOL_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTUdypfnDL2H51_65Yik4aTa41OY9CmVlNAR1oZO93f1VfJGAQpWFLrv9fUHhL90O22jnvHlc1dupXa/pub?output=csv";
    const RECIPE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSH-mQWDKyoHQuzr3bY3kA7fqrYJ0qC6CVsMJKUgSyeSaGN_YaIFGGbXGkb3gKnuvw8gtjxgNZ30ARV/pub?output=csv";

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIBwcP523moPifQ9mdYfY_nf2EJXzUl0qV8Pz5cgqflT28hA1qhwwqArr4QaMt-oW8nQ/exec";

    let appData = { kitchen: [], alcohol: [], recipes: [] };
    let currentView = 'kitchen';
    let activeFilter = 'ALL';

    // Native, zero-dependency RFC 4180 CSV parser: handles newlines, quotes, commas cleanly
    function parseCSV(text) {
      if (!text) return [];
      let str = text.replace(/^\uFEFF/, '');
      const rows = [];
      let row = [];
      let col = '';
      let inQuotes = false;
      
      for (let i = 0; i < str.length; i++) {
        const c = str[i];
        if (inQuotes) {
          if (c === '"') {
            if (i + 1 < str.length && str[i + 1] === '"') {
              col += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            col += c;
          }
        } else {
          if (c === '"') {
            inQuotes = true;
          } else if (c === ',') {
            row.push(col.trim());
            col = '';
          } else if (c === '\r') {
            if (i + 1 < str.length && str[i + 1] === '\n') i++;
            row.push(col.trim());
            col = '';
            if (row.some(val => val !== '')) rows.push(row);
            row = [];
          } else if (c === '\n') {
            row.push(col.trim());
            col = '';
            if (row.some(val => val !== '')) rows.push(row);
            row = [];
          } else {
            col += c;
          }
        }
      }
      if (col || row.length > 0) {
        row.push(col.trim());
        if (row.some(val => val !== '')) rows.push(row);
      }
      
      if (rows.length < 2) return [];
      const headers = rows[0].map(h => h.replace(/^["']|["']$/g, '').trim());
      
      return rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => {
          if (h) obj[h] = (r[idx] !== undefined ? r[idx] : '').replace(/^["']|["']$/g, '').trim();
        });
        return obj;
      });
    }

    // Flexible accessor that looks across multiple possible header variations
    function getVal(item, keys) {
      if (!item) return '';
      for (const k of keys) {
        if (item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== '') {
          return String(item[k]).trim();
        }
      }
      return '';
    }

    async function fetchInventory() {
      async function loadOne(url) {
        try {
          const res = await fetch(url);
          if (!res.ok) return [];
          const text = await res.text();
          return parseCSV(text);
        } catch (e) {
          console.warn("Failed fetching", url, e);
          return [];
        }
      }

      const [kitchenRows, alcoholRows, recipeRows] = await Promise.all([
        loadOne(KITCHEN_CSV_URL),
        loadOne(ALCOHOL_CSV_URL),
        loadOne(RECIPE_CSV_URL)
      ]);

      appData.kitchen = kitchenRows;
      appData.alcohol = alcoholRows;
      appData.recipes = recipeRows;

      document.getElementById('count-kitchen').textContent = appData.kitchen.length;
      document.getElementById('count-alcohol').textContent = appData.alcohol.length;
      document.getElementById('count-recipes').textContent = appData.recipes.length;

      renderChips();
      render();
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
    
    function navigate(view, event) {
      currentView = view;
      activeFilter = 'ALL';
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      if (event && event.currentTarget) event.currentTarget.classList.add('active');
      document.getElementById('sidebar').classList.remove('open');
      
      const titles = { kitchen: "Kitchen & Pantry", alcohol: "Master Alcohol", recipes: "Master Recipes" };
      document.getElementById('pageTitle').textContent = titles[view];
      document.getElementById('globalSearch').value = '';
      
      renderChips();
      render();
    }

    function renderChips() {
      const container = document.getElementById('categoryChips');
      const data = appData[currentView] || [];
      const categories = new Set();

      data.forEach(item => {
        const cat = getVal(item, ['Category', 'Cuisine Type', 'Cuisine']);
        if (cat) categories.add(cat);
      });

      if (categories.size === 0) {
        container.innerHTML = '';
        return;
      }

      let html = `<div class="chip ${activeFilter === 'ALL' ? 'active' : ''}" onclick="setFilter('ALL')">All Items</div>`;
      Array.from(categories).sort().forEach(cat => {
        html += `<div class="chip ${activeFilter === cat ? 'active' : ''}" onclick="setFilter('${cat.replace(/'/g, "\\'")}')">${cat}</div>`;
      });
      container.innerHTML = html;
    }

    function setFilter(cat) {
      activeFilter = cat;
      renderChips();
      render();
    }

    document.getElementById('globalSearch').addEventListener('input', render);

    function render() {
      const query = document.getElementById('globalSearch').value.toLowerCase();
      const grid = document.getElementById('mainGrid');
      const stats = document.getElementById('pageStats');
      let html = '';
      
      const data = appData[currentView] || [];
      const filtered = data.filter(item => {
        const itemCat = getVal(item, ['Category', 'Cuisine Type', 'Cuisine']);
        const matchesFilter = (activeFilter === 'ALL') || (itemCat === activeFilter);
        const matchesQuery = Object.values(item).join(' ').toLowerCase().includes(query);
        return matchesFilter && matchesQuery;
      });

      stats.textContent = `${filtered.length} items found`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No matching items found.</div>`;
        return;
      }

      if (currentView === 'kitchen') {
        html = filtered.map(item => {
          const name = getVal(item, ['ItemName', 'Item Name', 'Item']) || 'Unnamed Item';
          const loc = getVal(item, ['Location']) || 'Stock';
          const cat = getVal(item, ['Category']);
          const sub = getVal(item, ['SubCategory', 'Sub-Category']);
          const qty = getVal(item, ['Quantity']) || '-';
          const pkg = getVal(item, ['Packaging']);
          const notes = getVal(item, ['Notes']);
          return `
            <div class="card">
              <div class="card-header">
                <div class="card-title">${name}</div>
                <div class="badge ${loc.toLowerCase().includes('open') ? 'active' : ''}">${loc}</div>
              </div>
              <div class="card-meta">
                <strong>${cat}</strong> ${sub ? '&bull; ' + sub : ''}<br>
                Qty: <strong>${qty}</strong> ${pkg ? '(' + pkg + ')' : ''}
              </div>
              ${notes ? `<div class="card-notes">${notes}</div>` : ''}
            </div>
          `;
        }).join('');
      } 
      else if (currentView === 'alcohol') {
        html = filtered.map(item => {
          const name = getVal(item, ['Brand / Item Name', 'Brand', 'ItemName', 'Item Name']) || 'Unnamed Bottle';
          const status = getVal(item, ['Status']) || 'Sealed';
          const cat = getVal(item, ['Category']);
          const sub = getVal(item, ['SubCategory', 'Sub-Category']);
          const count = getVal(item, ['Bottle Count', 'Quantity']) || '-';
          const vol = getVal(item, ['Volume / Packaging', 'Packaging']);
          const notes = getVal(item, ['Tasting Notes & Style', 'Notes']);
          return `
            <div class="card">
              <div class="card-header">
                <div class="card-title">${name}</div>
                <div class="badge ${status.toLowerCase() === 'open' ? 'active' : ''}">${status}</div>
              </div>
              <div class="card-meta">
                <strong>${cat}</strong> ${sub ? '&bull; ' + sub : ''}<br>
                Qty: <strong>${count}</strong> ${vol ? '(' + vol + ')' : ''}
              </div>
              ${notes ? `<div class="card-notes">${notes}</div>` : ''}
            </div>
          `;
        }).join('');
      }
      else if (currentView === 'recipes') {
        html = filtered.map(item => {
          const titleEn = getVal(item, ['Title (English)', 'Title']) || 'Untitled Recipe';
          const titleBn = getVal(item, ['Title (বাংলা)', 'Title Bangla']);
          const cuisine = getVal(item, ['Cuisine Type', 'Cuisine']);
          const cat = getVal(item, ['Category']);
          const ingEn = getVal(item, ['Key Ingredients (English)', 'Key Ingredients', 'Ingredients']);
          const ingBn = getVal(item, ['Key Ingredients (বাংলা)']);
          const time = getVal(item, ['Time', 'Cook Time']);
          const instEn = getVal(item, ['Instructions (English)', 'Instructions', 'Steps']);
          const instBn = getVal(item, ['Instructions (বাংলা)']);
          return `
            <div class="card">
              <div class="card-header">
                <div>
                  <div class="card-title">${titleEn}</div>
                  ${titleBn ? `<div class="card-subtitle">${titleBn}</div>` : ''}
                </div>
                ${time ? `<div class="badge highlight">${time}</div>` : ''}
              </div>
              <div class="card-meta">
                <strong>${cuisine}</strong> ${cat ? '&bull; ' + cat : ''}
              </div>
              ${ingEn ? `
                <div class="card-notes">
                  <strong>Ingredients:</strong> ${ingEn}${ingBn ? `<div class="card-notes-bn">উপকরণ: ${ingBn}</div>` : ''}
                </div>` : ''
              }
              ${instEn ? `
                <div class="card-notes" style="margin-top:0.6rem;">
                  <strong>Steps:</strong> ${instEn}${instBn ? `<div class="card-notes-bn">প্রস্তুত প্রণালী: ${instBn}</div>` : ''}
                </div>` : ''
              }
            </div>
          `;
        }).join('');
      }

      grid.innerHTML = html;
    }

    /* Modal Form Logic */
    function openAddModal() {
      document.getElementById('entryType').value = currentView;
      switchFormFields();
      document.getElementById('addModal').classList.add('open');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('open');
      document.getElementById('addEntryForm').reset();
    }

    function switchFormFields() {
      const type = document.getElementById('entryType').value;
      const container = document.getElementById('dynamicFields');
      
      if (type === 'kitchen') {
        container.innerHTML = `
          <div class="form-group">
            <label>Item Name</label>
            <input type="text" name="itemName" required placeholder="e.g., Sumac, Black Lime Powder">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Category</label>
              <input type="text" name="category" placeholder="e.g., Spices, Pantry, Sauces">
            </div>
            <div class="form-group">
              <label>Sub Category</label>
              <input type="text" name="subcategory" placeholder="e.g., Whole Spices, Pastes">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Location</label>
              <input type="text" name="location" placeholder="e.g., Pantry Shelf 2, Fridge">
            </div>
            <div class="form-group">
              <label>Quantity</label>
              <input type="text" name="quantity" placeholder="e.g., 2">
            </div>
